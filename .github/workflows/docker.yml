name: Docker images

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
    branches: [dev]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose*.yml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
          - image: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests (including forks) only build; they never push.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }}
          # :dev and :main follow their branches; main is also :latest; a v1.2.3 tag gives :1.2.3.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  compose-smoke-test:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        # No Google credentials in CI; the auth gate itself is covered by pytest.
        env:
          AUTH_DISABLED: "true"
        run: docker compose up --build --wait --wait-timeout 180
      - name: Check frontend and proxied API
        run: |
          curl -fsS http://localhost:8080/ >/dev/null
          curl -fsS http://localhost:8080/api/health
      - name: Check the security headers (also on /assets/, where nginx drops inherited headers)
        run: |
          asset=$(curl -fsS http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          for url in http://localhost:8080/ "http://localhost:8080$asset"; do
            headers=$(curl -fsSI "$url")
            for name in Content-Security-Policy-Report-Only X-Frame-Options X-Content-Type-Options Referrer-Policy Permissions-Policy; do
              echo "$headers" | grep -qi "^$name:" || { echo "$url is missing $name"; exit 1; }
            done
          done
          echo "security headers present"
      - name: Check that only uploads accept a large body
        run: |
          printf '%2000000s' '' > big.json  # 2 MB; nginx refuses by size
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data-binary @big.json http://localhost:8080/api/descriptive/compute)
          [ "$code" = "413" ] || { echo "expected 413 for a 2 MB JSON body, got $code"; exit 1; }
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
